name: Build K85 OS v8.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download K85 OS v8.0 source
        uses: actions/checkout@v4
        with:
          repository: kion85/k85OS
          ref: v8.0
          persist-credentials: false

      - name: Build and create full flash image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          command: >-
            idf.py build &&
            cd build &&
            python -m esptool --chip esp32s3 merge_bin
            -o k85OS-v8.0-full.bin @flash_args

      - name: Upload installation file
        uses: actions/upload-artifact@v4
        with:
          name: k85OS-v8.0-full
          path: build/k85OS-v8.0-full.bin
          if-no-files-found: error
          retention-days: 7
